<!DOCTYPE html>
<html><head><title>Memberra</title></head>
<body>
<div id="MemberraConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <div data-role="content"><div class="content-primary">
    <form id="MemberraConfigForm">
      <div class="sectionTitleContainer flex align-items-center"><h2 class="sectionTitle">Memberra connection</h2></div>
      <div class="fieldDescription">Securely connects to <strong>https://memberra.co.uk</strong>. The destination is fixed to protect pairing credentials and playback data.</div>
      <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="PairingCode">One-time pairing code</label><input id="PairingCode" is="emby-input" type="password" autocomplete="one-time-code" /></div>
      <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="ProgressInterval">Progress interval (seconds)</label><input id="ProgressInterval" is="emby-input" type="number" min="5" max="300" /></div>
      <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="ReconciliationInterval">Recovery check interval (seconds)</label><input id="ReconciliationInterval" is="emby-input" type="number" min="15" max="300" /><div class="fieldDescription">Compares Memberra events with Jellyfin's active sessions to recover events missed during restarts or network interruptions.</div></div>
      <label class="checkboxContainer"><input id="ReconciliationEnabled" type="checkbox" is="emby-checkbox"/><span>Enable playback recovery and reconciliation</span></label>
      <label class="checkboxContainer"><input id="AllowRemoteStop" type="checkbox" is="emby-checkbox"/><span>Allow authorised Memberra operators to stop active playback</span><div class="fieldDescription">Off by default. Commands are limited to an active Jellyfin session and recorded by Memberra.</div></label>
      <label class="checkboxContainer"><input id="Enabled" type="checkbox" is="emby-checkbox"/><span>Enable Memberra integration</span></label>
      <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
    </form>
  </div></div>
  <script type="text/javascript">
    (() => { const id='5ca86b57-a68e-4c38-9089-87a809d14ec6', page=document.querySelector('#MemberraConfigPage');
      page.addEventListener('pageshow',()=>Dashboard.showLoadingMsg()||ApiClient.getPluginConfiguration(id).then(c=>{page.querySelector('#PairingCode').value='';page.querySelector('#ProgressInterval').value=c.ProgressIntervalSeconds;page.querySelector('#ReconciliationInterval').value=c.ReconciliationIntervalSeconds||30;page.querySelector('#ReconciliationEnabled').checked=c.ReconciliationEnabled!==false;page.querySelector('#AllowRemoteStop').checked=c.AllowRemoteStop===true;page.querySelector('#Enabled').checked=c.Enabled;Dashboard.hideLoadingMsg();}));
      page.querySelector('#MemberraConfigForm').addEventListener('submit',e=>{e.preventDefault();Dashboard.showLoadingMsg();ApiClient.getPluginConfiguration(id).then(c=>{c.MemberraUrl='https://memberra.co.uk';const p=page.querySelector('#PairingCode').value.trim();if(p)c.PairingCode=p;c.ProgressIntervalSeconds=Math.min(300,Math.max(5,Number(page.querySelector('#ProgressInterval').value)||15));c.ReconciliationIntervalSeconds=Math.min(300,Math.max(15,Number(page.querySelector('#ReconciliationInterval').value)||30));c.ReconciliationEnabled=page.querySelector('#ReconciliationEnabled').checked;c.AllowRemoteStop=page.querySelector('#AllowRemoteStop').checked;c.Enabled=page.querySelector('#Enabled').checked;return ApiClient.updatePluginConfiguration(id,c)}).then(Dashboard.processPluginConfigurationUpdateResult);});
    })();
  </script>
</div></body></html>
