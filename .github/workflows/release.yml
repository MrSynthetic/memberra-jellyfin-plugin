name: Publish plugin release

on:
  push:
    branches: [main]
    paths:
      - "MemberraProtocol.cs"
      - "releases/Memberra-Jellyfin-*.zip"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish versioned plugin archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' MemberraProtocol.cs)
          tag="v${version}"
          archives=(releases/Memberra-Jellyfin-${version}-10.11.zip releases/Memberra-Jellyfin-${version}-12.zip)
          test -n "$version"
          for a in "${archives[@]}"; do test -f "$a"; done
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" "${archives[@]}" \
            --target "$GITHUB_SHA" \
            --title "Memberra for Jellyfin ${version}" \
            --notes "Adds Jellyfin 12 support. Two builds from the same source: Memberra-Jellyfin-${version}-10.11.zip for Jellyfin 10.11.x and Memberra-Jellyfin-${version}-12.zip for Jellyfin 12.x. Jellyfin installs the right one automatically from the plugin repository."
